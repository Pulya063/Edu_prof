<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Калькулятор ROI освіти{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- theme-init.js (Dark mode flash prevention) -->
    <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                600: '#2563eb',
                900: '#1e3a8a',
              },
              dark: {
                bg: '#0f172a',
                card: '#1e293b',
                border: '#334155'
              }
            }
          }
        }
      }
    </script>
    
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply bg-slate-50 text-slate-900 dark:bg-dark-bg dark:text-slate-100 font-sans antialiased selection:bg-primary-500 selection:text-white transition-colors duration-300;
        }
      }
      @layer utilities {
        .glass {
          @apply bg-white/70 dark:bg-slate-900/80 backdrop-blur-lg border border-white/20 dark:border-slate-700/50;
        }
        .form-input {
          @apply w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-dark-bg px-4 py-2.5 text-slate-900 dark:text-white focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/50 transition-all placeholder-slate-400 dark:placeholder-slate-500;
        }
        .form-label {
          @apply block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5;
        }
        .btn-primary {
          @apply w-full inline-flex justify-center items-center rounded-lg bg-primary-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-primary-500 shadow-sm hover:shadow transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed;
        }
        .card {
          @apply bg-white dark:bg-dark-card rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 sm:p-8;
        }
        .text-link {
          @apply text-primary-600 dark:text-primary-400 font-medium hover:underline;
        }
        .text-muted {
          @apply text-slate-500 dark:text-slate-400;
        }
        
        /* HTMX Indicator Overrides */
        .htmx-indicator {
          display: none;
        }
        .htmx-request .htmx-indicator {
          display: inline-block;
        }
        .htmx-request.htmx-indicator {
          display: inline-block;
        }
        .htmx-request .indicator-hidden {
          display: none;
        }
        
        /* ── Autocomplete Styles ── */
        .autocomplete-wrap { position: relative; }
        .autocomplete-list {
          position: absolute; top: 100%; left: 0; right: 0;
          margin-top: 8px; border-radius: 1rem;
          background-color: rgba(255, 255, 255, 0.85);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid rgba(226, 232, 240, 0.6);
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
          max-height: 300px; overflow-y: auto; z-index: 50;
          transition: all 0.2s ease-in-out;
        }
        .dark .autocomplete-list {
          background-color: rgba(30, 41, 59, 0.85);
          border-color: rgba(51, 65, 85, 0.6);
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }
        .autocomplete-item {
          padding: 0.875rem 1.25rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(241, 245, 249, 0.5);
          transition: background-color 0.15s ease;
        }
        .dark .autocomplete-item { border-bottom-color: rgba(51, 65, 85, 0.5); }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover, .autocomplete-item--active { background-color: rgba(248, 250, 252, 0.9); }
        .dark .autocomplete-item:hover, .dark .autocomplete-item--active { background-color: rgba(15, 23, 42, 0.8); }
        .autocomplete-item__name { font-weight: 600; font-size: 0.875rem; color: #0f172a; transition: color 0.15s ease; }
        .dark .autocomplete-item__name { color: #f8fafc; }
        .autocomplete-item:hover .autocomplete-item__name, .autocomplete-item--active .autocomplete-item__name { color: #2563eb; }
        .dark .autocomplete-item:hover .autocomplete-item__name, .dark .autocomplete-item--active .autocomplete-item__name { color: #60a5fa; }
        .autocomplete-item__meta { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; }
        .dark .autocomplete-item__meta { color: #94a3b8; }
        .autocomplete-item__badge {
          font-size: 0.65rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 9999px; background-color: rgba(219, 234, 254, 0.8); color: #1e40af; text-transform: uppercase; letter-spacing: 0.025em;
        }
        .dark .autocomplete-item__badge { background-color: rgba(30, 58, 138, 0.6); color: #93c5fd; }
        .autocomplete-item__badge--world { background-color: rgba(243, 232, 255, 0.8); color: #6b21a8; }
        .dark .autocomplete-item__badge--world { background-color: rgba(59, 7, 100, 0.6); color: #d8b4fe; }
        .autocomplete-loading { padding: 1rem; font-size: 0.875rem; color: #64748b; text-align: center; font-weight: 500; }
        
        .autocomplete-list::-webkit-scrollbar { width: 6px; }
        .autocomplete-list::-webkit-scrollbar-track { background: transparent; margin: 4px 0; }
        .autocomplete-list::-webkit-scrollbar-thumb { background: rgba(203, 213, 225, 0.8); border-radius: 10px; }
        .autocomplete-list::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.9); }
        .dark .autocomplete-list::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); }
        .dark .autocomplete-list::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.9); }
      }
    </style>

    {% block styles %}{% endblock %}
    
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js" defer></script>
  </head>
  <body hx-boost="true" class="min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 glass border-b border-slate-200/50 dark:border-slate-800/50 shadow-sm">
      <nav class="container mx-auto px-4 h-16 flex items-center justify-between">
        <a href="/" class="text-xl font-bold tracking-tight text-primary-600 dark:text-primary-500 hover:opacity-80 transition-opacity">
          ROI освіти
        </a>
        <div class="flex items-center space-x-4 md:space-x-6">
          <button id="theme-toggle" class="p-2 rounded-full text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors" title="Toggle Theme">
            <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          
          <a href="/calculator" class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors">Калькулятор</a>
          
          {% if g.user %}
          <div id="user-links" class="flex items-center space-x-4">
            <a href="/main" class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors">Дашборд</a>
            <a href="/roadmap" class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors">Roadmap</a>
            <a href="/profile" class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors">Профіль</a>
            <button id="logout-btn" class="text-sm font-medium text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 transition-colors">Вийти</button>
          </div>
          {% else %}
          <div id="auth-links" class="flex items-center space-x-4">
            <a href="/login" class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-primary-600 dark:hover:text-primary-400 transition-colors">Увійти</a>
            <a href="/register" class="text-sm font-medium bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-2 rounded-lg hover:bg-slate-800 dark:hover:bg-white shadow-sm hover:shadow-md transition-all active:scale-95">Реєстрація</a>
          </div>
          {% endif %}
        </div>
      </nav>
    </header>
    
    <main class="flex-grow flex flex-col items-center w-full">
      {% block content %}{% endblock %}
    </main>
    
    <footer class="mt-auto py-8 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-dark-bg">
      <div class="container mx-auto px-4 text-center text-sm text-slate-500 dark:text-slate-400">
        &copy; 2026 ROI освіти. Всі права захищені.
      </div>
    </footer>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
