{% extends "base.html" %}
{% block title %}Реєстрація | ROI освіти{% endblock %}
{% block styles %}
{% endblock %}
{% block content %}
<section class="flex flex-col items-center justify-center min-h-[calc(100vh-140px)] p-4 relative overflow-hidden w-full">
  
  <div class="absolute inset-0 bg-slate-50 dark:bg-[#0f172a] z-[-2]"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg h-96 bg-blue-500/20 blur-[100px] rounded-full z-[-1] pointer-events-none"></div>

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Створити акаунт</h1>
      <p class="text-slate-500 dark:text-slate-400 mt-2">Почніть свій шлях до правильних фінансових рішень.</p>
    </div>

    <form class="bg-white/80 dark:bg-[#1e293b]/80 backdrop-blur-xl rounded-2xl shadow-xl border border-slate-200/50 dark:border-slate-700/50 p-8"
          hx-post="/api/auth/register"
          hx-ext="json-enc"
          hx-target="#error-container"
          hx-swap="innerHTML"
          hx-indicator="#register-indicator">
      <div class="space-y-5">
        <div class="flex flex-col">
          <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Електронна пошта</label>
          <input id="email" name="email" type="email" required
                 class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-[#0f172a] px-4 py-2.5 text-slate-900 dark:text-white focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all placeholder-slate-400 dark:placeholder-slate-500" placeholder="example@mail.com">
        </div>
        
        <div class="flex flex-col">
          <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Пароль</label>
          <div class="relative">
            <input id="password" name="password" type="password" required
                   class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-[#0f172a] px-4 py-2.5 pr-10 text-slate-900 dark:text-white focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all placeholder-slate-400 dark:placeholder-slate-500" placeholder="••••••••">
            <button type="button" onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password';" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 focus:outline-none transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
          </div>
        </div>
        
        <div class="flex flex-col">
          <label for="confirm_password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Підтвердіть пароль</label>
          <div class="relative">
            <input id="confirm_password" name="confirm_password" type="password" required
                   class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-[#0f172a] px-4 py-2.5 pr-10 text-slate-900 dark:text-white focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all placeholder-slate-400 dark:placeholder-slate-500" placeholder="••••••••">
            <button type="button" onclick="const p = document.getElementById('confirm_password'); p.type = p.type === 'password' ? 'text' : 'password';" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 focus:outline-none transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
          </div>
        </div>
      </div>

      <div id="error-container"></div>
      
      <button type="submit" class="w-full inline-flex justify-center items-center rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-blue-500 shadow-sm hover:shadow transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed mt-6 group">
        <span>Зареєструватись</span>
        <svg id="register-indicator" class="htmx-indicator animate-spin w-4 h-4 ml-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <svg class="w-4 h-4 ml-2 group-hover:translate-x-1 transition-transform indicator-hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </button>

      <p class="mt-8 text-center text-sm text-slate-600 dark:text-slate-400">
        Вже маєте акаунт?
        <a href="/login" class="text-blue-600 dark:text-blue-400 font-medium hover:underline ml-1">Увійти</a>
      </p>
    </form>
  </div>
</section>

<script>
  // Клієнтська перевірка збігу паролів
  const registerForm = document.querySelector('form[hx-post="/api/auth/register"]');
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirm_password');

  if (passwordInput && confirmInput) {
    function validatePasswords() {
      if (passwordInput.value !== confirmInput.value) {
        confirmInput.setCustomValidity("Паролі не співпадають");
      } else {
        confirmInput.setCustomValidity("");
      }
    }

    passwordInput.addEventListener('input', validatePasswords);
    confirmInput.addEventListener('input', validatePasswords);
  }
</script>
{% endblock %}
