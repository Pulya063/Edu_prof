{% extends "ui/base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<section class="auth">
  <h1>Освіта як інвестиція.<br><em>Порахуймо.</em></h1>
  <p class="muted">Швидкий інтерфейс Fence: сценарій навчання → детермінований прогноз → AI-рев'ю.</p>
  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="login">Вхід</button>
    <button class="tab" data-tab="register">Реєстрація</button>
  </div>
  <form class="card" data-auth="login">
    <label>Email<input type="email" name="email" required autocomplete="email"></label>
    <label>Пароль<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-lime" type="submit">Увійти</button>
  </form>
  <form class="card" data-auth="register" hidden>
    <label>Email<input type="email" name="email" required autocomplete="email"></label>
    <label>Пароль<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn btn-lime" type="submit">Створити акаунт</button>
  </form>
</section>
{% endblock %}
