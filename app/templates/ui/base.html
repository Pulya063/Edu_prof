<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fence{% endblock %} · Fence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='ui/ui.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/ui/">Fence<span>.</span></a>
    {% if user %}
    <nav>
      <a href="/ui/">Сценарії</a>
      <a href="/ui/new" class="btn btn-lime btn-sm">+ Новий</a>
      <button class="link" data-logout>Вийти</button>
    </nav>
    {% endif %}
  </header>
  <main class="wrap">
    <div class="flash" id="flash" role="alert" hidden></div>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='ui/ui.js') }}"></script>
</body>
</html>
