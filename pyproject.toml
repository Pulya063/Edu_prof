[project]
name = "education-roi-calculator"
version = "0.1.0"
description = "Production-ready MVP backend skeleton for an Education ROI Calculator"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.3",
    "asgiref>=3.8.1",
    "authlib>=1.3.0",
    "celery>=5.3.0",
    "chromadb>=0.4.0",
    "deepagents>=0.3.0,<1.0.0",
    "email-validator>=2.2.0",
    "flask>=3.0.3",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=21.2.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.4",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-ollama>=1.0.0,<2.0.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "passlib[bcrypt]>=1.7.4",
    "pika>=1.3.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.35",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    "pytest>=8.3.0",
    "ruff>=0.6.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*"]
ignore_missing_imports = true
